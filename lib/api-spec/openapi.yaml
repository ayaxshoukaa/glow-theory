openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /shop-api
    description: Glow Theory API route (forwarded to Next.js app/api routes)
tags:
  - name: health
    description: Service health status
  - name: products
    description: Product catalog
  - name: auth
    description: Customer accounts and sessions
  - name: orders
    description: Customer order history
  - name: diagnostics
    description: Authenticated database health checks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Check whether the API server is healthy
      responses:
        "200":
          description: API server is ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthCheckResponse" }
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: Search and filter products
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/ProductCategory" }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [featured, price-asc, price-desc, name]
      responses:
        "200":
          description: Matching catalog products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
        "500":
          $ref: "#/components/responses/ServerError"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupInput" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this email already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in customer
      responses:
        "200":
          description: Current customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /orders:
    get:
      operationId: getMyOrders
      tags: [orders]
      summary: List the signed-in customer's orders
      responses:
        "200":
          description: Orders belonging to the signed-in customer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401":
          description: Sign in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /database-check:
    post:
      operationId: checkDatabase
      tags: [diagnostics]
      summary: Check the authenticated user's database connection
      responses:
        "200":
          description: MongoDB responded to a read-only ping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseCheckResponse" }
        "401":
          description: Sign in required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: MongoDB could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  responses:
    BadRequest:
      description: The request data is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The requested product was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: The server could not complete the request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    HealthStatus:
      type: string
      enum: [ok]
    HealthCheckResponse:
      type: object
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
      required: [status]
    ProductCategory:
      type: string
      enum: [Skincare, Lip Care, Body Care, Gift Sets]
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        image: { type: string }
        category: { $ref: "#/components/schemas/ProductCategory" }
        isBestseller: { type: boolean }
        featured: { type: boolean }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - name
        - description
        - price
        - image
        - category
        - isBestseller
        - featured
        - createdAt
    SignupInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
      required:
        - name
        - email
        - password
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
      required: [email, password]
    UserProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
      required: [id, name, email]
    OrderItem:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        image: { type: string }
        quantity: { type: integer, minimum: 1 }
        price: { type: number, minimum: 0 }
      required: [productId, name, image, quantity, price]
    Order:
      type: object
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        total: { type: number, minimum: 0 }
        status:
          type: string
          enum: [pending, paid]
        createdAt: { type: string, format: date-time }
      required: [id, items, total, status, createdAt]
    DatabaseCheckResponse:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
      required: [ok, message]
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

